<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ViewFit Demo — Gallery</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="site-nav">
      <a class="site-nav__brand" href="index.html">ViewFit</a>
      <div class="site-nav__links">
        <a href="index.html">Home</a>
        <a class="active" href="gallery.html">Gallery</a>
      </div>
    </nav>

    <header class="hero hero--short">
      <img class="hero__image" src="assets/gallery-hero.jpg" alt="High-resolution gallery hero" />
      <div class="hero__content">
        <p class="eyebrow">Demo site · page 2</p>
        <h1>Gallery</h1>
        <p>Two more high-resolution photos, rendered in a responsive card grid.</p>
      </div>
    </header>

    <main class="page">
      <section class="grid">
        <article class="card">
          <img src="assets/gallery-card-1.jpg" alt="Portrait photo one" />
          <h2>Portrait one</h2>
          <p>3902 × 5050, displayed as a square with object-fit cover.</p>
        </article>
        <article class="card">
          <img src="assets/gallery-card-2.jpg" alt="Portrait photo two" />
          <h2>Portrait two</h2>
          <p>3734 × 5601, the same rendered size as the previous card.</p>
        </article>
      </section>

      <section class="thumbs">
        <h2>Small icons</h2>
        <div class="thumbs__row">
          <img src="assets/thumb.png" alt="Icon one" />
          <img src="assets/thumb.png" alt="Icon two" />
          <img src="assets/thumb.png" alt="Icon three" />
          <img src="assets/thumb.png" alt="Icon four" />
        </div>
      </section>

      <p class="back"><a class="button" href="index.html">← Back to home</a></p>
    </main>
  </body>
</html>
